name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore .\Fit2Gpx.csproj --runtime win-x64

      - name: Publish Windows app
        run: dotnet publish .\Fit2Gpx.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output .\publish\win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path .\publish\win-x64\* -DestinationPath .\Fit2Gpx-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" ".\Fit2Gpx-${{ github.ref_name }}-win-x64.zip" --title "Fit2Gpx ${{ github.ref_name }}" --notes-file .\.github\release-notes.md --generate-notes
